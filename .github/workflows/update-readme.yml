name: Update profile README

on:
  schedule:
    - cron: "47 5 1 * *" # monthly, on the 1st
  workflow_dispatch:
    inputs:
      forget:
        description: "Test run: re-propose already seen items whose id contains this text (e.g. midea-lan)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-readme

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find new contributions and draft the README section
        id: update
        run: python3 .github/readme-bot/update.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FORGET: ${{ inputs.forget }}

      - name: Open or update the PR
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: bot/readme-update
          delete-branch: true
          add-paths: |
            README.md
            .github/readme-bot/state.json
          commit-message: Update the open source section of the README
          title: Update the open source section of the README
          body-path: .github/readme-bot/pr-body.md
